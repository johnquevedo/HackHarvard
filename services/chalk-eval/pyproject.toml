[project]
name = "dennis-eval"
version = "0.1.0"
description = "Dennis evaluation suites run as Chalk Evaluations"
requires-python = ">=3.11,<3.15"
dependencies = [
  "chalkcompute==2.13.7",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dennis_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
